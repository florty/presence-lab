# Copy to common/common.yaml and put your values in secrets.yaml (see secrets.example.yaml).
# Both copies are gitignored.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if Wi-Fi fails
  ap:
    ssid: ${device_name}
    password: !secret hotspot_password
  # To use a fixed address instead of DHCP, uncomment and set device_ip in presence-office.yaml:
  # manual_ip:
  #   static_ip: ${device_ip}
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

captive_portal:

logger:

# Native API: Home Assistant and the presence bridge both connect here (one at a time works best)
api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret esphome_ota_password
